name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend:
        name: Backend (Pint + PHPUnit)
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: taskmanager
                    POSTGRES_PASSWORD: secret
                    POSTGRES_DB: taskmanager_test
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U taskmanager -d taskmanager_test"
                    --health-interval 5s --health-timeout 5s --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, pgsql, intl, zip, bcmath, pcntl
                  coverage: none
            - uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
            - run: composer install --no-interaction --prefer-dist --no-progress
            - run: cp .env.example .env && php artisan key:generate
            # phpunit.xml points at host "db" (the docker-compose service name).
            - run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts
            - run: vendor/bin/pint --test
            - run: php artisan test

    frontend:
        name: Frontend (types, lint, unit tests, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build
            # Only production dependencies gate the build; dev-tool advisories are reported by Dependabot.
            - run: npm audit --omit=dev --audit-level=high

    e2e:
        name: End-to-end (Playwright)
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci && npm run build
            - run: cp .env.example .env
            - run: docker compose run --rm --no-deps app sh -c "composer install --no-interaction --prefer-dist --no-progress && php artisan key:generate"
            - run: bash scripts/e2e.sh
              env:
                  CI: 'true'
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: e2e/.results
                  retention-days: 7
