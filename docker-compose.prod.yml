# Production stack: web (Caddy+PHP, automatic HTTPS), reminder scheduler, PostgreSQL.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Configuration lives in .env.production (copy .env.production.example). Never commit it.
name: taskly

x-app: &app
    image: taskly:prod
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
        - storage:/app/storage

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-taskly}
            POSTGRES_USER: ${DB_USERNAME:-taskly}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.production}
        volumes:
            - pgdata:/var/lib/postgresql/data
        # Not published to the host: only the app containers on the internal network can reach it.
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-taskly} -d ${DB_DATABASE:-taskly}']
            interval: 5s
            timeout: 3s
            retries: 20

    app:
        <<: *app
        # Only `app` builds the image; `scheduler` reuses it (two builds of one tag would collide).
        build:
            context: .
            dockerfile: Dockerfile.prod
        environment:
            RUN_MIGRATIONS: '1'
            SITE_ADDRESS: ${SITE_ADDRESS:-:80}
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        volumes:
            - storage:/app/storage
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            db:
                condition: service_healthy

    # Fires due-date reminders: `schedule:work` runs the every-minute scheduler (see routes/console.php).
    scheduler:
        <<: *app
        command: php artisan schedule:work
        # The image healthcheck probes the web port, which the scheduler doesn't serve; if the process
        # dies the container exits and `restart: unless-stopped` brings it back.
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_healthy

volumes:
    pgdata:
    storage:
    caddy_data:
    caddy_config:
